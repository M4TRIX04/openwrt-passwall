name: Release IPK

# 产物：
#   luci-app-passwall_<版本>_all.ipk   LUCI_PKGARCH:=all，架构无关
#   latest.txt                         版本标记，LuCI 的手动更新读这个
#
# latest.txt 格式（api.lua 的 to_check_self 按 key=value 解析）：
#   version=26.11.18-r1
#   file=luci-app-passwall_26.11.18-r1_all.ipk
#   sha256=...
#
# 每次构建发一个独立 release（tag 为 <版本>-<修订>），不覆盖旧版本。
# 客户端走 /releases/latest/download/<资产名>，指向 GitHub 标记为 Latest 的
# 那个 release，所以不需要固定 tag 名；回滚只需在页面上把旧版本标成 Latest。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ipk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate .config
        run: |
          {
            echo "CONFIG_ALL_NONSHARED=n"
            echo "CONFIG_ALL_KMODS=n"
            echo "CONFIG_ALL=n"
            echo "CONFIG_AUTOREMOVE=n"
            echo "CONFIG_PACKAGE_luci-app-passwall=m"
          } > .config

      - name: Compile With OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: x86_64-24.10.5
          PACKAGES: luci-app-passwall
          # 依赖的二进制包来自自己的 packages fork，不用上游（上游还带着本项目
          # 已删除的 xray / sing-box / hysteria2 等，引进来只会放大构建面）。
          EXTRA_FEEDS: src-git|passwall_packages|https://github.com/M4TRIX04/openwrt-passwall-packages.git;main
          BUILD_LOG: 1

      - name: Collect IPK and write latest.txt
        run: |
          mkdir -p out
          find bin/packages/ -type f -name 'luci-app-passwall_*.ipk' -exec cp {} out/ \;
          n=$(find out -name '*.ipk' | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "期望产出 1 个 ipk，实际 $n 个"
            ls -l out
            exit 1
          fi

          ipk=$(basename "$(ls out/*.ipk)")
          case "$ipk" in
            *_all.ipk) ;;
            *) echo "::warning::$ipk 不是 _all 架构，与 LUCI_PKGARCH:=all 的预期不符" ;;
          esac

          ver=$(echo "$ipk" | cut -d_ -f2)
          {
            echo "version=$ver"
            echo "file=$ipk"
            echo "sha256=$(sha256sum "out/$ipk" | cut -d' ' -f1)"
          } > out/latest.txt

          echo "VERSION=$ver" >> "$GITHUB_ENV"
          ls -l out
          cat out/latest.txt

      - name: Publish release
        run: |
          # tag 用 <版本>-<修订>，ipk 名字里是 <版本>-r<修订>，去掉那个 r。
          tag="${VERSION/-r/-}"

          cat > /tmp/notes.md <<EOF
          ## luci-app-passwall ${VERSION}

          构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，提交 \`${GITHUB_SHA:0:7}\`。

          ### 在 LuCI 里更新

          组件更新 → Passwall 版本 → 「检查更新」，有新版会变成「点击更新」，
          点一下即可下载安装并重启服务。

          ### 手动安装

          \`\`\`
          opkg install --force-reinstall https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename $(ls out/*.ipk))
          \`\`\`

          装完清一下 LuCI 缓存并重启服务：

          \`\`\`
          rm -rf /tmp/luci-indexcache* /tmp/luci-modulecache
          /etc/init.d/passwall restart
          \`\`\`
          EOF

          # 先建草稿再传资产，全部成功后一次性发布。草稿不会被 /releases/latest
          # 指到，所以传到一半失败只会留下一份没人看得见的草稿，不会出现
          # 「latest.txt 已是新版、ipk 却没传上去」的半成品。
          # 发布后它就是最新的非草稿 release，GitHub 会自动把它标成 Latest。
          gh release create "$tag" --draft \
            --title "luci-app-passwall ${VERSION}" \
            --notes-file /tmp/notes.md \
            out/*

          gh release edit "$tag" --draft=false

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
