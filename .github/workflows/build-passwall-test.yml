name: Passwall test IPK

# 只产出 ipk 当 artifact，不发布。用来验证某一版代码在指定 SDK 上编得出来。
#
# 触发时选编哪个 SDK：both / 24.10 / 21.02。
#
# 和 Release IPK 的区别：这里不设 optional，任何一腿编不过都要看见红叉——
# 它本来就是拿来探路的。Release 那边才把 21.02 标成 optional，避免挡住主资产。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '编译哪个 SDK'
        type: choice
        options:
          - both
          - "24.10"
          - "21.02"
        default: both

permissions:
  contents: read

jobs:
  prepare:
    name: prepare matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build matrix from input
        id: set
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          cat > /tmp/matrix.json <<'EOF'
          [
            {"arch":"x86_64-24.10.5","label":"24.10","feeds":"src-git|passwall_packages|https://github.com/M4TRIX04/openwrt-passwall-packages.git;main"},
            {"arch":"x86_64-21.02.7","label":"21.02","feeds":""}
          ]
          EOF

          case "$TARGETS" in
            "24.10") filter='select(.label=="24.10")' ;;
            "21.02") filter='select(.label=="21.02")' ;;
            *)       filter='.' ;;
          esac

          matrix=$(jq -c "[.[] | $filter]" /tmp/matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  build:
    name: build ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate .config
        run: |
          {
            echo "CONFIG_ALL_NONSHARED=n"
            echo "CONFIG_ALL_KMODS=n"
            echo "CONFIG_ALL=n"
            echo "CONFIG_AUTOREMOVE=n"
            echo "CONFIG_PACKAGE_luci-app-passwall=m"
          } > .config

      - name: Compile With OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: luci-app-passwall
          EXTRA_FEEDS: ${{ matrix.feeds }}
          BUILD_LOG: 1

      - name: Collect LuCI IPKs
        run: |
          mkdir -p upload
          find bin/packages/ -type f -name 'luci-app-passwall_*.ipk' -exec cp {} upload/ \;
          compgen -G 'upload/luci-app-passwall_*.ipk' > /dev/null
          ls -l upload

      - name: Upload test IPKs
        uses: actions/upload-artifact@v6
        with:
          name: passwall-${{ matrix.label }}-${{ github.run_id }}
          path: upload/*.ipk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ matrix.label }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
