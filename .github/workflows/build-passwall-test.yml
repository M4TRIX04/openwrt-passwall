name: Passwall test IPK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate .config
        run: |
          {
            echo "CONFIG_ALL_NONSHARED=n"
            echo "CONFIG_ALL_KMODS=n"
            echo "CONFIG_ALL=n"
            echo "CONFIG_AUTOREMOVE=n"
            echo "CONFIG_PACKAGE_luci-app-passwall=m"
          } > .config

      - name: Compile With OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: x86_64-24.10.5
          PACKAGES: luci-app-passwall
          # luci-app-passwall 的 LUCI_DEPENDS 依赖 passwall-packages 提供的
          # chinadns-ng / dns2socks / ipt2socks / microsocks / tcping /
          # shadowsocks-c / hysteria，这些都不在 SDK 默认 feed 里，必须额外引入。
          # 用自己的 fork，不用上游：上游还带着 xray / sing-box / hysteria2 等
          # 本项目已经删掉的包，多引进来只会让构建面变大。
          EXTRA_FEEDS: src-git|passwall_packages|https://github.com/M4TRIX04/openwrt-passwall-packages.git;main
          BUILD_LOG: 1

      - name: Collect LuCI IPKs
        run: |
          mkdir -p upload
          find bin/packages/ -type f -name 'luci-app-passwall_*.ipk' -exec cp {} upload/ \;
          compgen -G 'upload/luci-app-passwall_*.ipk' > /dev/null
          ls -l upload

      - name: Upload test IPKs
        uses: actions/upload-artifact@v6
        with:
          name: passwall-24.10.5-x86_64-${{ github.run_id }}
          path: upload/*.ipk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
